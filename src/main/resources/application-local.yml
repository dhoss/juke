spring:
  config:
    activate:
      on-profile: local
  devtools:
    restart:
      additional-paths: file:src/main/resources/static/css/, file:src/main/resources/templates/
  application:
    name: juke
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      jdbc-url: >
        jdbc:postgresql://localhost:5432/juke
      pool-name: juke-pool
      username: juke
      password: juke
  flyway:
    enabled: false
pebble:
  cache: false
logging:
  level:
    in.stonecolddev: DEBUG
    org.springframework.jdbc.core: TRACE
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.springframework.security: DEBUG
